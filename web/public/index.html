<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#142c29"><title>VaVi Lantern · Eternal Flame</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="campaign.css"></head>
<body>
<canvas id="world" aria-label="Side-view lantern bridge game"></canvas>
<header><a id="brand" href="#" aria-label="VaVi Lantern home"><img src="vavi-tech-logo.png" alt="VaViTech24"><span>VaVi <b>Lantern</b></span></a><div class="topright"><section id="hud" hidden aria-live="off"></section><span id="weather">THE QUIET HEIGHTS</span><button id="sound" aria-label="Enable sound">Sound off</button><button id="pause" hidden>Pause</button></div></header>
<main id="menu" class="panel">
 <div class="eyebrow"><span class="journeyBullet" aria-hidden="true">&#8226;</span> Serene and Relaxing Journey</div>
 <h1><span>Carry the</span> <em>last flame.</em></h1>
 <p class="intro"><span class="introLead">Find your pace. Keep the flame alive.</span><span class="journeyReward">Finish the journey. Your gift awaits.</span></p>
 <div class="modes" role="group" aria-label="Game mode"><button class="selected" data-mode="solo">Solo journey</button><button data-mode="local">Two together</button></div>
 <p id="levelSummary" class="levelSummary"></p><button id="start" class="primary">Begin the journey <span>↗</span></button>
 <div class="subactions"><button id="levels">Levels <span>↗</span></button><button id="characters">Choose traveler <span>↗</span></button></div>
 <div class="menuExtras"><button id="records">My records <span>↗</span></button></div>
</main>
<footer id="footer"><div id="skies"><button data-sky="dawn" class="selected">Dawn</button><button data-sky="dusk">Dusk</button><button data-sky="night">Night</button></div><span class="copyright">&copy; VaViTech24 <span class="copyrightYear">2026</span></span></footer>
<div id="toast" role="status"></div>
<div id="controls" hidden></div>
<dialog id="dialog"><button id="close" aria-label="Close">×</button><div id="dialogContent"></div></dialog>
<script src="engine.js"></script><script src="sound.js"></script><script src="characters.js"></script><script src="game.js"></script><script src="online.js"></script>
</body></html>
